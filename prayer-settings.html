<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>إعدادات الصلاة — وِرْدِي</title>
<link rel="icon" type="image/png" href="assets/img/logo.png" />
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;800&display=swap" />
<link rel="stylesheet" href="assets/css/style.css" />
<link rel="stylesheet" href="assets/css/header.css" />
<link rel="stylesheet" href="assets/css/prayer-settings.css" />
<link rel="stylesheet" href="assets/css/pwa.css" />
<link rel="stylesheet" href="assets/css/adhan.css" />
  <link rel="stylesheet" href="assets/css/footer.css" />
</head>
<body>

<div class="app">
  <div data-header-target></div>

  <header class="athkar-header">
    <button class="nav-btn" onclick="history.back()">↪</button>
    <h2>إعدادات الصلاة</h2>
    <div style="width:42px"></div>
  </header>

  <!-- ============================================
       🔔 قسم الأذان
       ============================================ -->
  <section class="settings-group">

    <!-- تنبيه إذن الإشعارات -->
    <div class="adhan-permission-alert" id="permissionAlert">
      <span class="apa-ico">🔔</span>
      <span class="apa-txt">للحصول على تنبيهات الأذان، نحتاج إذن الإشعارات</span>
      <button class="apa-btn" id="requestPermissionBtn" type="button">السماح</button>
    </div>

    <!-- تفعيل الأذان -->
    <div class="settings-item">
      <div class="item-info"><span class="ico">🕌</span><span>تشغيل الأذان تلقائيًا</span></div>
      <label class="switch"><input type="checkbox" id="adhanEnabled" checked><span class="slider"></span></label>
    </div>

    <!-- المؤذن -->
    <div class="adhan-settings-card">
      <h4>🎵 المؤذن</h4>
      <div class="adhan-prayer-row">
        <div class="apr-info">
          <span class="apr-ico">🎤</span>
          <span>ناصر القطامي</span>
        </div>
        <span style="font-size:12px;color:var(--green);font-weight:700;">✓ المختار</span>
      </div>
      <button class="adhan-test-btn" id="testAdhanBtn" type="button">🔊 تجربة صوت الأذان</button>
    </div>

    <!-- الصلوات -->
    <div class="adhan-settings-card">
      <h4>🕌 الصلوات المشغَّلة</h4>

      <div class="adhan-prayer-row">
        <div class="apr-info"><span class="apr-ico">🌄</span><span>الفجر</span></div>
        <label class="switch"><input type="checkbox" data-prayer="Fajr" checked><span class="slider"></span></label>
      </div>
      <div class="adhan-prayer-row">
        <div class="apr-info"><span class="apr-ico">🌞</span><span>الظهر</span></div>
        <label class="switch"><input type="checkbox" data-prayer="Dhuhr" checked><span class="slider"></span></label>
      </div>
      <div class="adhan-prayer-row">
        <div class="apr-info"><span class="apr-ico">🌤️</span><span>العصر</span></div>
        <label class="switch"><input type="checkbox" data-prayer="Asr" checked><span class="slider"></span></label>
      </div>
      <div class="adhan-prayer-row">
        <div class="apr-info"><span class="apr-ico">🌅</span><span>المغرب</span></div>
        <label class="switch"><input type="checkbox" data-prayer="Maghrib" checked><span class="slider"></span></label>
      </div>
      <div class="adhan-prayer-row">
        <div class="apr-info"><span class="apr-ico">🌙</span><span>العشاء</span></div>
        <label class="switch"><input type="checkbox" data-prayer="Isha" checked><span class="slider"></span></label>
      </div>
    </div>

  </section>

  <!-- ============================================
       📍 الموقع
       ============================================ -->
  <section class="settings-group">
    <h3 class="group-title">📍 الموقع</h3>

    <div class="settings-item">
      <div class="item-info"><span class="ico">📡</span><span>استخدام موقعي تلقائيًا</span></div>
      <label class="switch"><input type="checkbox" id="useGeo" checked><span class="slider"></span></label>
    </div>

    <div class="settings-item column" id="manualBlock" style="display:none;">
      <div class="item-info"><span class="ico">✏️</span><span>الإحداثيات يدويًا</span></div>
      <div class="coord-row">
        <input type="number" id="inpLat" placeholder="Lat" step="0.0001" />
        <input type="number" id="inpLng" placeholder="Lng" step="0.0001" />
      </div>
      <input type="text" id="inpCity" placeholder="المدينة" class="text-input" />
    </div>
  </section>

  <!-- ============================================
       🧮 طريقة الحساب
       ============================================ -->
  <section class="settings-group">
    <h3 class="group-title">🧮 طريقة الحساب</h3>

    <div class="settings-item column">
      <div class="item-info"><span class="ico">🕌</span><span>الجهة</span></div>
      <select id="methodSelect" class="select-input">
        <option value="4">🏛️ أم القرى</option>
        <option value="3">🌍 رابطة العالم الإسلامي</option>
        <option value="5">🇪🇬 الجمعية المصرية</option>
        <option value="2">🇺🇸 ISNA</option>
      </select>
    </div>

    <div class="settings-item column">
      <div class="item-info"><span class="ico">📐</span><span>مذهب العصر</span></div>
      <div class="radio-group">
        <label class="radio-opt"><input type="radio" name="school" value="0" checked><span>الجمهور</span></label>
        <label class="radio-opt"><input type="radio" name="school" value="1"><span>الحنفي</span></label>
      </div>
    </div>
  </section>

  <!-- ============================================
       💾 الأزرار
       ============================================ -->
  <div class="action-buttons">
    <button class="btn primary" id="saveBtn">💾 حفظ الإعدادات</button>
    <button class="btn" id="refreshBtn">🔄 تحديث المواقيت</button>
  </div>

</div>

<!-- ============================================
     📜 السكربتات
     ============================================ -->
<script src="assets/js/app.js"></script>
<script src="assets/js/navbar.js"></script>
<script src="assets/js/header.js"></script>
<script src="assets/js/logo.js"></script>
<script src="assets/js/seo.js"></script>
<script src="assets/js/pwa.js"></script>
<script src="assets/js/adhan.js"></script>

<!-- ============================================
     🎯 سكربت الصفحة — الإعدادات + الإشعارات
     ============================================ -->
<script>
(function () {
  'use strict';

  console.log('🚀 سكربت إعدادات الصلاة جاهز');

  /* ============ ثوابت ============ */
  const PS_KEY = 'prayer_settings';
  const PS_DEFAULTS = {
    method: 4,
    school: 0,
    lat: 24.7136,
    lng: 46.6753,
    cityName: 'الرياض',
    cityDetail: 'السعودية',
    manualLocation: false,
  };

  function getSettings() {
    try {
      return { ...PS_DEFAULTS, ...(JSON.parse(localStorage.getItem(PS_KEY) || '{}')) };
    } catch {
      return { ...PS_DEFAULTS };
    }
  }

  function saveSettings(s) {
    localStorage.setItem(PS_KEY, JSON.stringify(s));
  }

  function clearTimesCache() {
    Object.keys(localStorage)
      .filter(k => k.startsWith('prayer_times_cache_'))
      .forEach(k => localStorage.removeItem(k));
  }

  /* ============ زر "السماح" للإشعارات ============ */
  function initNotificationPermission() {
    const requestBtn = document.getElementById('requestPermissionBtn');
    const permissionAlert = document.getElementById('permissionAlert');

    /* عند التحميل: إذا كان الإذن ممنوحًا → أخفِ التنبيه */
    if ('Notification' in window) {
      if (Notification.permission === 'granted' && permissionAlert) {
        permissionAlert.style.display = 'none';
      }
    } else {
      console.warn('⚠️ المتصفح لا يدعم Notification API');
    }

    if (!requestBtn) {
      console.warn('⚠️ لم أجد زر السماح');
      return;
    }

    requestBtn.addEventListener('click', async () => {
      console.log('🔔 طلب إذن الإشعارات...');

      /* المتصفح لا يدعم */
      if (!('Notification' in window)) {
        alert('⚠️ متصفحك لا يدعم الإشعارات');
        return;
      }

      /* الإذن ممنوح مسبقًا */
      if (Notification.permission === 'granted') {
        alert('✅ الإشعارات مسموحة بالفعل');
        if (permissionAlert) permissionAlert.style.display = 'none';
        return;
      }

      /* الإذن مرفوض */
      if (Notification.permission === 'denied') {
        alert('⚠️ الإشعارات مرفوضة. افتح إعدادات المتصفح للسماح بها:\n\n' +
              'Chrome: القفل بجانب الرابط → الإشعارات → السماح');
        return;
      }

      /* طلب الإذن */
      try {
        const permission = await Notification.requestPermission();
        console.log('نتيجة الإذن:', permission);

        if (permission === 'granted') {
          alert('✅ تم تفعيل الإشعارات — بارك الله فيك');
          if (permissionAlert) permissionAlert.style.display = 'none';

          /* إشعار تجريبي */
          try {
            new Notification('🕌 وِرْدِي', {
              body: 'تم تفعيل إشعارات الأذان بنجاح',
              icon: 'assets/img/icon-192.png',
              badge: 'assets/img/icon-192.png',
            });
          } catch (e) {
            console.warn('تعذّر عرض إشعار تجريبي:', e);
          }
        } else if (permission === 'denied') {
          alert('⚠️ تم رفض الإشعارات');
        }
      } catch (err) {
        console.error('❌ خطأ في طلب الإذن:', err);
        alert('⚠️ حدث خطأ: ' + err.message);
      }
    });
  }

  /* ============ زر "تجربة الأذان" ============ */
  function initTestButton() {
    const btn = document.getElementById('testAdhanBtn');
    if (!btn) {
      console.warn('⚠️ لم أجد زر تجربة الأذان');
      return;
    }

    btn.addEventListener('click', function (e) {
      e.preventDefault();
      console.log('🎵 تم الضغط على تجربة الأذان');

      try {
        let volume = 0.8;
        try {
          const s = JSON.parse(localStorage.getItem('adhan_settings') || '{}');
          if (s.volume) volume = s.volume;
        } catch {}

        const audio = new Audio('assets/audio/adhan.mp3');
        audio.volume = volume;

        const promise = audio.play();
        if (promise && promise.then) {
          promise
            .then(() => console.log('✅ الأذان يعمل بنجاح'))
            .catch(err => {
              console.error('❌ فشل التشغيل:', err);
              alert('⚠️ تعذّر تشغيل الأذان: ' + (err.message || err));
            });
        }
      } catch (err) {
        console.error('❌ خطأ:', err);
        alert('⚠️ حدث خطأ: ' + err.message);
      }
    });
  }

  /* ============ الموقع ============ */
  function initLocation() {
    const s = getSettings();
    const useGeoEl = document.getElementById('useGeo');
    const manualBlockEl = document.getElementById('manualBlock');
    const inpLat = document.getElementById('inpLat');
    const inpLng = document.getElementById('inpLng');
    const inpCity = document.getElementById('inpCity');

    if (useGeoEl) {
      const useGeo = !s.manualLocation;
      useGeoEl.checked = useGeo;

      if (manualBlockEl) {
        manualBlockEl.style.display = useGeo ? 'none' : 'flex';
      }

      useGeoEl.addEventListener('change', (e) => {
        if (manualBlockEl) {
          manualBlockEl.style.display = e.target.checked ? 'none' : 'flex';
        }
      });
    }

    if (inpLat && s.manualLocation) inpLat.value = s.lat || '';
    if (inpLng && s.manualLocation) inpLng.value = s.lng || '';
    if (inpCity && s.manualLocation) inpCity.value = s.cityName || '';
  }

  /* ============ طريقة الحساب ============ */
  function initMethod() {
    const s = getSettings();
    const methodSelect = document.getElementById('methodSelect');

    if (methodSelect) {
      methodSelect.value = String(s.method);
    }

    document.querySelectorAll('input[name="school"]').forEach(r => {
      r.checked = String(s.school) === r.value;
    });
  }

  /* ============ الحفظ ============ */
  function initSaveButton() {
    const saveBtn = document.getElementById('saveBtn');
    if (!saveBtn) return;

    saveBtn.addEventListener('click', () => {
      const s = getSettings();
      const useGeoEl = document.getElementById('useGeo');
      const manualBlockEl = document.getElementById('manualBlock');
      const inpLat = document.getElementById('inpLat');
      const inpLng = document.getElementById('inpLng');
      const inpCity = document.getElementById('inpCity');
      const methodSelect = document.getElementById('methodSelect');

      const useGeo = useGeoEl ? useGeoEl.checked : true;
      s.manualLocation = !useGeo;

      if (methodSelect) {
        s.method = parseInt(methodSelect.value, 10);
      }

      const schoolEl = document.querySelector('input[name="school"]:checked');
      if (schoolEl) {
        s.school = parseInt(schoolEl.value, 10);
      }

      if (!useGeo) {
        const lat = inpLat ? parseFloat(inpLat.value) : NaN;
        const lng = inpLng ? parseFloat(inpLng.value) : NaN;
        const city = inpCity ? inpCity.value.trim() : '';

        if (isNaN(lat) || isNaN(lng)) {
          alert('⚠️ الرجاء إدخال إحداثيات صحيحة');
          return;
        }
        s.lat = lat;
        s.lng = lng;
        s.cityName = city || 'موقع مخصص';
        s.cityDetail = `${lat.toFixed(3)}°، ${lng.toFixed(3)}°`;
      }

      saveSettings(s);
      clearTimesCache();

      alert('✅ تم حفظ الإعدادات');
      location.href = 'prayer.html';
    });
  }

  /* ============ زر التحديث ============ */
  function initRefreshButton() {
    const refreshBtn = document.getElementById('refreshBtn');
    if (!refreshBtn) return;

    refreshBtn.addEventListener('click', () => {
      clearTimesCache();
      alert('🔄 تم مسح البيانات المؤقتة');
    });
  }

  /* ============ التهيئة ============ */
  function init() {
    initNotificationPermission();
    initTestButton();
    initLocation();
    initMethod();
    initSaveButton();
    initRefreshButton();

    console.log('✅ اكتملت تهيئة صفحة الإعدادات');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>

  <script src="assets/js/footer.js"></script>
  <script src="assets/js/interactions.js"></script>
</body>
</html>
