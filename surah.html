<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1F4E3D" />
<title>السورة — وِرْدِي</title>
<link rel="icon" type="image/png" href="assets/img/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/style.css" />
<link rel="stylesheet" href="assets/css/header.css" />
<link rel="stylesheet" href="assets/css/quran.css" />
<link rel="stylesheet" href="assets/css/share-image.css" />

<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="assets/css/pwa.css" />
</head>
<body>

<div id="wirdi-live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

<div class="app surah-app">
  <div data-header-target></div>

  <header class="athkar-header">
    <button class="nav-btn" onclick="history.back()">↪</button>
    <h2 id="surahTitle">…</h2>
    <button class="nav-btn" id="surahMenuBtn">⋯</button>
  </header>

  <div class="surah-info" id="surahInfo"></div>

  <div class="mushaf-page">
    <div class="mushaf-bar" id="mushafBar">
      <div class="mb-item">
        <span class="mb-label">الجزء</span>
        <span class="mb-value" id="mbJuz">—</span>
      </div>
      <div class="mb-divider">﴿ ﴾</div>
      <div class="mb-item">
        <span class="mb-label">الصفحة</span>
        <span class="mb-value" id="mbPage">—</span>
      </div>
      <div class="mb-divider">﴿ ﴾</div>
      <div class="mb-item">
        <span class="mb-label">الحزب</span>
        <span class="mb-value" id="mbHizb">—</span>
      </div>
    </div>

    <div class="bismillah" id="bismillah">﷽</div>
    <div class="verses" id="verses">
      <div class="loading">⏳ جارٍ تحميل الآيات…</div>
    </div>
  </div>

  <div class="surah-nav">
    <button class="sn-btn" id="prevSurah">◀ السابقة</button>
    <button class="sn-btn" id="nextSurah">التالية ▶</button>
  </div>

  <div class="audio-player" id="audioPlayer" style="display:none;">
    <button class="ap-btn" id="apPlay">▶</button>
    <div class="ap-info">
      <span class="ap-title" id="apTitle">—</span>
      <span class="ap-time" id="apTime">٠:٠٠ / ٠:٠٠</span>
    </div>
    <div class="ap-progress" id="apProgress">
      <span class="ap-fill" id="apFill" style="width: 0%"></span>
    </div>
  </div>
</div>

<!-- ============================================
     📖 نافذة التفسير المنبثقة
     ============================================ -->
<div class="tafsir-modal" id="tafsirModal" hidden>
  <div class="tafsir-backdrop" id="tafsirBackdrop"></div>
  <div class="tafsir-dialog" role="dialog" aria-modal="true" aria-labelledby="tafsirTitle">
    <div class="tafsir-header">
      <div class="tafsir-head-info">
        <span class="tafsir-ico">📖</span>
        <div>
          <h3 id="tafsirTitle">التفسير الميسر</h3>
          <p id="tafsirSubtitle">—</p>
        </div>
      </div>
      <button class="tafsir-close" id="tafsirClose" aria-label="إغلاق">✕</button>
    </div>

    <div class="tafsir-verse" id="tafsirVerse"></div>

    <div class="tafsir-body" id="tafsirBody">
      <div class="tafsir-loading">
        <span class="spinner"></span>
        <span>جارٍ تحميل التفسير…</span>
      </div>
    </div>

    <div class="tafsir-footer">
      <span class="tafsir-source" id="tafsirSource">المصدر: alquran.cloud</span>
      <button class="tafsir-copy" id="tafsirCopy">📋 نسخ التفسير</button>
    </div>
  </div>
</div>

<script src="assets/js/app.js"></script>
<script src="assets/js/navbar.js"></script>
<script src="assets/js/header.js"></script>
<script src="assets/js/logo.js"></script>
<script src="assets/js/share-image.js"></script>
<script src="assets/js/surah.js"></script>
<script src="assets/js/seo.js"></script>

<script src="assets/js/pwa.js"></script>
<script src="assets/js/adhan.js"></script>
</body>
</html>
