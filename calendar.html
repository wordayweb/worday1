<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1F4E3D" />
<title>التقويم الهجري — وِرْدِي</title>
<link rel="icon" type="image/png" href="assets/img/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="assets/css/style.css" />
<link rel="stylesheet" href="assets/css/header.css" />
<link rel="stylesheet" href="assets/css/calendar.css" />

<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="assets/css/pwa.css" />
  <link rel="stylesheet" href="assets/css/footer.css" />
</head>
<body>

<div class="app">
  <div data-header-target></div>

  <header class="athkar-header">
    <button class="nav-btn" onclick="history.back()">↪</button>
    <h2>التقويم</h2>
    <button class="nav-btn" id="todayBtn" title="اليوم">◎</button>
  </header>

  <section class="today-card">
    <div class="tc-side">
      <p class="tc-label">اليوم</p>
      <p class="tc-weekday" id="tcWeekday">…</p>
    </div>
    <div class="tc-center">
      <p class="tc-hijri" id="tcHijri">…</p>
      <p class="tc-greg" id="tcGreg">…</p>
    </div>
    <div class="tc-day-badge">
      <span id="tcDayHijri">…</span>
      <span id="tcDayGreg">…</span>
    </div>
  </section>

  <div class="cal-nav">
    <button class="cal-nav-btn" id="prevMonth">‹</button>
    <h3 class="cal-nav-title" id="calTitle">…</h3>
    <button class="cal-nav-btn" id="nextMonth">›</button>
  </div>

  <section class="dual-calendar">
    <div class="cal-box hijri-box">
      <div class="cal-box-head"><span class="cal-box-ico">🌙</span><span>التقويم الهجري</span></div>
      <div class="cal-weekdays"><span>أحد</span><span>إثن</span><span>ثلا</span><span>أرب</span><span>خمي</span><span>جمع</span><span>سبت</span></div>
      <div class="cal-grid" id="hijriGrid"></div>
    </div>

    <div class="cal-box greg-box">
      <div class="cal-box-head"><span class="cal-box-ico">📅</span><span>التقويم الميلادي</span></div>
      <div class="cal-weekdays"><span>أحد</span><span>إثن</span><span>ثلا</span><span>أرب</span><span>خمي</span><span>جمع</span><span>سبت</span></div>
      <div class="cal-grid" id="gregGrid"></div>
    </div>
  </section>

  <section class="events-box">
    <h3>🎉 مناسبات الشهر</h3>
    <ul id="eventsList"></ul>
  </section>
</div>

<script src="assets/js/app.js"></script>
<script src="assets/js/navbar.js"></script>
<script src="assets/js/header.js"></script>
<script src="assets/js/logo.js"></script>
<script src="assets/js/calendar.js"></script>
<script src="assets/js/seo.js"></script>

<script src="assets/js/pwa.js"></script>
<script src="assets/js/adhan.js"></script>
  <script src="assets/js/footer.js"></script>
  <script src="assets/js/interactions.js"></script>
</body>
</html>
