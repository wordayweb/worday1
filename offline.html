<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1F4E3D" />
<meta name="robots" content="noindex, nofollow" />
<title>لا يوجد اتصال — وِرْدِي</title>
<link rel="icon" type="image/png" href="assets/img/logo.png" />
<link rel="apple-touch-icon" href="assets/img/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;800&display=swap" />
<link rel="stylesheet" href="assets/css/style.css" />
<link rel="stylesheet" href="assets/css/header.css" />
<style>
  .offline-wrap {
    min-height: 70vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
  }
  .offline-icon {
    font-size: clamp(80px, 20vw, 140px);
    margin-bottom: 20px;
    animation: offlinePulse 3s ease-in-out infinite;
    display: inline-block;
  }
  @keyframes offlinePulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(1.08); opacity: .8; }
  }
  .offline-wrap h1 {
    font-family: 'Amiri', serif;
    font-size: clamp(24px, 5vw, 34px);
    color: var(--green);
    margin-bottom: 12px;
    font-weight: 700;
  }
  .offline-wrap p {
    font-size: clamp(14px, 3vw, 17px);
    color: var(--ink-soft);
    line-height: 1.8;
    max-width: 500px;
    margin-bottom: 24px;
  }
  .offline-ayah {
    font-family: 'Amiri', serif;
    font-size: clamp(16px, 4vw, 22px);
    color: var(--gold);
    padding: 16px 24px;
    background: linear-gradient(180deg, rgba(201, 162, 39, .1), transparent);
    border-radius: 16px;
    border-right: 3px solid var(--gold);
    max-width: 500px;
    margin-bottom: 28px;
  }
  .offline-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 28px;
    border-radius: 999px;
    background: linear-gradient(160deg, var(--green-2), var(--green));
    color: #fff;
    text-decoration: none;
    font-weight: 800;
    font-size: 15px;
    box-shadow: 0 8px 20px rgba(31, 78, 61, .25);
    transition: all .2s;
    border: none;
    cursor: pointer;
    font-family: inherit;
  }
  .offline-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 26px rgba(31, 78, 61, .35);
  }
</style>
</head>
<body>

<div class="app">
  <div data-header-target></div>

  <section class="offline-wrap">
    <div class="offline-icon">📡</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>يبدو أنك غير متصل بالإنترنت الآن. يمكنك الاستمرار في استخدام التطبيق — الملفات مخزّنة مسبقًا.</p>
    <div class="offline-ayah">
      ﴿ فَاذْكُرُونِي أَذْكُرْكُمْ وَاشْكُرُوا لِي وَلَا تَكْفُرُونِ ﴾
      <span style="display:block;font-size:13px;color:var(--ink-soft);margin-top:8px;">— البقرة: ١٥٢</span>
    </div>
    <button class="offline-btn" onclick="location.reload()">
      <span>🔄</span>
      <span>حاول مجددًا</span>
    </button>
  </section>
</div>

<script src="assets/js/app.js"></script>
<script src="assets/js/header.js"></script>
<script src="assets/js/logo.js"></script>
<script src="assets/js/adhan.js"></script>
</body>
</html>
